name: Alpha Terminal Alert Runner

on:
  schedule:
    - cron: '15 * * * *'   # :15 past every hour — position tracker heartbeat

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Telegram messages)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: alert-runner
  cancel-in-progress: false

jobs:
  run-alerts:
    name: Check alerts & positions
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run alert runner
        working-directory: scripts
        env:
          # ── Required secrets (Settings → Secrets and variables → Actions → Secrets) ──
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

          # ── Option B: GitHub Secrets/Variables sync ──────────────────────────────────
          # If you use Option B in the GUI (no browser PAT), set these variables so the
          # runner knows where positions.json lives. GITHUB_TOKEN is automatic — no setup.
          #
          # Settings → Secrets and variables → Actions → Variables:
          #   GH_REPO           = yourname/alpha-terminal   (required for Option B)
          #   GH_BRANCH         = main                      (optional, default: main)
          #   GH_POSITIONS_PATH = scripts/positions.json    (optional, default shown)
          #
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:              ${{ vars.GH_REPO }}
          GH_BRANCH:            ${{ vars.GH_BRANCH || 'main' }}
          GH_POSITIONS_PATH:    ${{ vars.GH_POSITIONS_PATH || 'scripts/positions.json' }}

          # ── Optional tuning ──────────────────────────────────────────────────────────
          # Settings → Secrets and variables → Actions → Variables:
          #   TELEGRAM_ENABLED     = true   (set 'false' to silence without removing secrets)
          #   ALERT_COOLDOWN_HOURS = 1      (hrs between repeated rule alerts, default 1h)
          #   DIGEST_MODE          = true   (batch alerts into one message per cycle)
          #   DRY_RUN              = false  (set 'true' to test without sending Telegram)
          #
          # ── Leaderboard / position tracker tuning ────────────────────────────────────
          #   LB_MIN_SCORE    = 9    (min conviction score to fire buy alert, 0-14)
          #   LB_COOLDOWN_MIN = 60   (min minutes between buy alerts per symbol)
          #   LB_HOLD_LOCK    = 20   (min minutes after entry before exit scoring starts)
          #   LB_CVD_CYCLES   = 3    (consecutive CVD decline cycles to confirm exit)
          TELEGRAM_ENABLED:     ${{ vars.TELEGRAM_ENABLED || 'true' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '1' }}
          DIGEST_MODE:          ${{ vars.DIGEST_MODE || 'true' }}
          DRY_RUN:              ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          LB_MIN_SCORE:         ${{ vars.LB_MIN_SCORE || '9' }}
          LB_COOLDOWN_MIN:      ${{ vars.LB_COOLDOWN_MIN || '60' }}
          LB_HOLD_LOCK:         ${{ vars.LB_HOLD_LOCK || '20' }}
          LB_CVD_CYCLES:        ${{ vars.LB_CVD_CYCLES || '3' }}

        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN — no Telegram messages will be sent"
            node alert-runner.js --dry-run
          else
            node alert-runner.js
          fi

      - name: Commit alert state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet scripts/.alert-state.json 2>/dev/null; then
            echo "No state changes — skipping commit"
          else
            git add scripts/.alert-state.json
            git commit -m "chore: update alert state [skip ci]"
            git push
          fi
