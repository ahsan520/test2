name: Alpha Terminal – Alert Check

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    
    # Allows the runner to commit the state back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX: Changed from npm ci to npm install
      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Run alert checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '4' }}
          DIGEST_MODE:          ${{ vars.DIGEST_MODE || 'true' }}
        run: node scripts/alert-runner.js

      # FIX: Saves the state file so cooldowns actually work
      - name: Commit and Push State Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the suppression file created by your runner
          git add scripts/.alert-state.json || true
          
          # Only commit if the file actually changed
          git commit -m "chore: update alert suppression state [skip ci]" || echo "No state changes."
          git push
