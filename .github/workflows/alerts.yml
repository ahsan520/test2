name: Alpha Terminal — Alert Check

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

# Only one run at a time — prevents concurrent runs from racing on
# .alert-state.json and defeating suppression.
concurrency:
  group: alert-check
  cancel-in-progress: false   # queue, don't cancel — every run should persist state

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit state file back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Run alert checker
        env:
          # ── REQUIRED GitHub Secrets (Settings → Secrets → Actions) ──────────
          # TELEGRAM_BOT_TOKEN  : your bot token from @BotFather  e.g. 123456:ABC-xyz
          # TELEGRAM_CHAT_ID    : your chat/channel ID            e.g. -1001234567890
          #   Get chat ID: message your bot then call
          #   https://api.telegram.org/bot<TOKEN>/getUpdates and read result[0].message.chat.id
          # ────────────────────────────────────────────────────────────────────
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '4' }}
          DIGEST_MODE:          ${{ vars.DIGEST_MODE || 'true' }}
          # Optional — override the default watchlist with a JSON array string
          # WATCHLIST: '["TXF.TO","CRWD.TO","GOOG.TO","BTCUSDT"]'
        run: node scripts/alert-runner.js

      - name: Persist alert state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.alert-state.json
          git diff --cached --quiet && echo "No state changes." && exit 0
          git commit -m "chore: update alert state [skip ci]"
          # Retry push up to 3 times with a pull --rebase in between,
          # so concurrent runs don't silently drop state.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push failed (attempt $i) — rebasing and retrying…"
            git pull --rebase
          done
          echo "ERROR: could not push alert state after 3 attempts" >&2
          exit 1
