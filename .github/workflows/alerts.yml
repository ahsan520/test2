name: Alpha Terminal Alert Runner

on:
  schedule:
    # Job A — market data fetch only. No alerts, no Telegram, no position
    # writes. Just refreshes market-data.json (with peak shock/obi tracking)
    # so Job B always has fresh-ish data without needing to call Binance
    # itself on its own 15-min cycle.
    - cron: '*/5 * * * *'        # every 5 minutes

    # Job B — leaderboard buy decision (reads market-data.json, opens
    # positions on qualifying setups) + position tracker sell-side check
    # (stop/T1/T2 on open positions). Offset from Job A by 2+ minutes so
    # market-data.json is always fresh when Job B reads it.
    - cron: '2,19,36,53 * * * *'       # every 15 minutes

    # Full scan — watchlist signal/overnight rules. Hourly matches the
    # 4h/daily timeframes that logic operates on. The OLD leaderboard buy
    # scanner inside alert-runner.js is disabled by default here (see
    # LB_LEGACY_SCAN) since Job B now owns the buy side on a faster cycle.
    - cron: '15 * * * *'         # :15 past every hour

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Telegram messages)'
        required: false
        default: 'false'
        type: boolean
      mode:
        description: 'Run mode (manual runs only — scheduled runs pick this automatically)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - positions
          - fetch
          - decide

concurrency:
  group: alert-runner
  cancel-in-progress: false

jobs:
  run-alerts:
    name: Check alerts & positions
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      # ── Determine run mode ──────────────────────────────────────────────
      # */5      → fetch     (market-fetcher.js — Job A, data only)
      # 2,19,36,53 → decide  (leaderboard-decider.js + positions check — Job B)
      # :15 hourly → full    (alert-runner.js full watchlist/overnight scan)
      # workflow_dispatch    → whatever the "mode" input says (default: full)
      #
      # NOTE: github.event.schedule tells us exactly which cron string
      # triggered this run, so there's no ambiguity even when two schedules
      # coincide.
      - name: Determine run mode
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "*/5 * * * *" ]; then
            VALUE="fetch"
          elif [ "$SCHEDULE" = "2,19,36,53 * * * *" ]; then
            VALUE="decide"
          elif [ "$SCHEDULE" = "15 * * * *" ]; then
            VALUE="full"
          elif [ -n "${{ inputs.mode }}" ]; then
            VALUE="${{ inputs.mode }}"
          else
            VALUE="full"
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $VALUE (schedule: '${SCHEDULE:-manual}')"

      # ── Write env.js with real credentials (runtime only — never committed) ──
      # This file is written to disk for GitHub Pages to serve to the browser.
      # It is reset to blanks BEFORE any git commit so secrets never enter git history.
      - name: Write env.js (runtime credentials)
        env:
          GH_PAT:             ${{ secrets.GH_PAT }}
          GH_REPO:            ${{ vars.GH_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf "// Auto-generated by GitHub Actions — DO NOT edit manually.\n" > scripts/env.js
          printf "// Reset to blanks before every git commit — secrets never enter git history.\n" >> scripts/env.js
          printf "window.__GH_PAT   = '%s';\n" "$GH_PAT"             >> scripts/env.js
          printf "window.__GH_REPO  = '%s';\n" "$GH_REPO"            >> scripts/env.js
          printf "window.__TG_TOKEN = '%s';\n" "$TELEGRAM_BOT_TOKEN" >> scripts/env.js
          printf "window.__TG_CHAT  = '%s';\n" "$TELEGRAM_CHAT_ID"   >> scripts/env.js
          echo "✓ env.js written"
          echo "  GH_PAT:  $([ -n "$GH_PAT"             ] && echo '✓' || echo '✗ MISSING')"
          echo "  TG:      $([ -n "$TELEGRAM_BOT_TOKEN"  ] && echo '✓' || echo '✗ MISSING')"

      # ── Ensure tracking files exist ──
      - name: Ensure tracking files exist
        run: |
          if [ ! -f scripts/positions.json ]; then
            echo '{}' > scripts/positions.json
            echo "Created empty positions.json"
          else
            COUNT=$(python3 -c "import sys,json; d=json.load(open('scripts/positions.json')); print(len(d))" 2>/dev/null || echo "?")
            echo "positions.json exists: ${COUNT} position(s)"
          fi

          if [ ! -f scripts/tracker.json ]; then
            echo '{}' > scripts/tracker.json
            echo "Created empty tracker.json"
          fi

          if [ ! -f scripts/market-data.json ]; then
            echo '{"fetchedAt":0,"symbols":{}}' > scripts/market-data.json
            echo "Created empty market-data.json"
          fi

          if [ ! -f scripts/lb-alert-state.json ]; then
            echo '{}' > scripts/lb-alert-state.json
            echo "Created empty lb-alert-state.json"
          fi

          if [ ! -f scripts/audit.json ]; then
            echo '[]' > scripts/audit.json
            echo "Created empty audit.json"
          fi

      # ── Run the resolved mode ──
      - name: Run alert pipeline
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ vars.GH_REPO }}
          GH_BRANCH:          ${{ vars.GH_BRANCH || 'main' }}
          GH_POSITIONS_PATH:  ${{ vars.GH_POSITIONS_PATH || 'scripts/positions.json' }}
          GH_TRACKER_PATH:    ${{ vars.GH_TRACKER_PATH || 'scripts/tracker.json' }}
          TELEGRAM_ENABLED:   ${{ vars.TELEGRAM_ENABLED || 'true' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '1' }}
          DIGEST_MODE:        ${{ vars.DIGEST_MODE || 'true' }}
          DRY_RUN:            ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          LB_MIN_SCORE:       ${{ vars.LB_MIN_SCORE || '9' }}
          LB_COOLDOWN_MIN:    ${{ vars.LB_COOLDOWN_MIN || '60' }}
          LB_HOLD_LOCK:       ${{ vars.LB_HOLD_LOCK || '20' }}
          LB_CVD_CYCLES:      ${{ vars.LB_CVD_CYCLES || '3' }}
          LB_ALERT_STATE_TTL_HOURS: ${{ vars.LB_ALERT_STATE_TTL_HOURS || '6' }}
          LB_LEGACY_SCAN:     ${{ vars.LB_LEGACY_SCAN || 'false' }}
          RUN_MODE:           ${{ steps.mode.outputs.value }}
        run: |
          echo "Running in mode: $RUN_MODE"
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN — no Telegram messages will be sent"
            DRY_FLAG="--dry-run"
          fi

          case "$RUN_MODE" in
            fetch)
              node market-fetcher.js
              ;;
            decide)
              node leaderboard-decider.js $DRY_FLAG
              node alert-runner.js $DRY_FLAG --mode=positions
              ;;
            positions)
              node alert-runner.js $DRY_FLAG --mode=positions
              ;;
            full)
              node alert-runner.js $DRY_FLAG --mode=full
              ;;
            *)
              echo "Unknown mode: $RUN_MODE" >&2
              exit 1
              ;;
          esac

      # ── Commit state — RESET env.js to blanks FIRST ──────────────────────
      # Critical order:
      #   1. Overwrite env.js with blank values (secrets wiped from disk)
      #   2. git add each file individually (missing files skip cleanly)
      #   3. git commit + push (no secrets ever reach git history)
      - name: Commit alert state (secrets-safe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # STEP 1 — Wipe secrets from env.js before anything touches git
          printf "// Auto-generated by GitHub Actions — DO NOT edit manually.\n" > scripts/env.js
          printf "// Credentials are written at runtime and reset here before commit.\n" >> scripts/env.js
          printf "// The browser receives live values via GitHub Pages during workflow run.\n" >> scripts/env.js
          printf "window.__GH_PAT   = '';\n" >> scripts/env.js
          printf "window.__GH_REPO  = '';\n" >> scripts/env.js
          printf "window.__TG_TOKEN = '';\n" >> scripts/env.js
          printf "window.__TG_CHAT  = '';\n" >> scripts/env.js

          # STEP 2 — Stage files individually so a missing file doesn't
          # silently block the others (e.g. market-data.json) from staging.
          git add scripts/env.js || true
          git add scripts/market-data.json || true
          git add scripts/positions.json || true
          git add scripts/tracker.json || true
          git add scripts/audit.json || true
          git add scripts/.alert-state.json || true
          git add scripts/.lb-scan-state.json || true
          git add scripts/lb-alert-state.json || true

          # STEP 3 — Verify env.js staged content has no real tokens
          if git diff --cached -- scripts/env.js | grep -E "ghp_|ghs_|bot[0-9]+:" > /dev/null 2>&1; then
            echo "🚨 SAFETY ABORT — env.js appears to contain real tokens, refusing to commit"
            exit 1
          fi

          # STEP 4 — Commit and push
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update alert state [skip ci]"
            git push
          fi
