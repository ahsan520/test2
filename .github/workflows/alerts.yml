name: Alpha Terminal Alert Runner

on:
  schedule:
    - cron: '15 * * * *'   # :15 past every hour — position tracker heartbeat
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Telegram messages)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: alert-runner
  cancel-in-progress: false

jobs:
  run-alerts:
    name: Check alerts & positions
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      # ── Write env.js — exposes GH_PAT to the browser for Option B sync ──
      # The browser loads scripts/env.js which sets window.__GH_PAT and
      # window.__GH_REPO so it can push positions.json without a localStorage PAT.
      # GH_PAT must be a fine-grained PAT with Contents: Read and write on this repo.
      - name: Write env.js for browser credentials
        env:
          GH_PAT:             ${{ secrets.GH_PAT }}
          GH_REPO:            ${{ vars.GH_REPO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > scripts/env.js << ENVEOF
          // Auto-generated by GitHub Actions — DO NOT edit manually.
          // Exposes secrets as window globals so the browser can send Telegram alerts
          // and push positions.json without storing credentials in localStorage.
          window.__GH_PAT       = '${GH_PAT}';
          window.__GH_REPO      = '${GH_REPO}';
          window.__TG_TOKEN     = '${TELEGRAM_BOT_TOKEN}';
          window.__TG_CHAT      = '${TELEGRAM_CHAT_ID}';
          ENVEOF
          echo "env.js written — GH_PAT: $([ -n "$GH_PAT" ] && echo yes || echo MISSING) | TG: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo yes || echo MISSING)"

      # ── Ensure positions.json exists (first run safety) ──
      - name: Ensure positions.json exists
        run: |
          if [ ! -f scripts/positions.json ]; then
            echo '{}' > scripts/positions.json
            echo "Created empty positions.json"
          else
            echo "positions.json exists: $(cat scripts/positions.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(f\"{len(d)} position(s)\")')"
          fi

      - name: Run alert runner
        working-directory: scripts
        env:
          # ── Required secrets ──────────────────────────────────────────────────────────
          # Settings → Secrets and variables → Actions → Secrets:
          #   TELEGRAM_BOT_TOKEN  = your bot token from @BotFather
          #   TELEGRAM_CHAT_ID    = your chat ID
          #   GH_PAT              = fine-grained PAT, Contents: Read+Write on this repo
          #                         (used by browser Option B sync via env.js)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}

          # ── Option B position fetch ───────────────────────────────────────────────────
          # Settings → Secrets and variables → Actions → Variables:
          #   GH_REPO = ahsan520/alpha  (required)
          GH_REPO:            ${{ vars.GH_REPO }}
          GH_BRANCH:          ${{ vars.GH_BRANCH || 'main' }}
          GH_POSITIONS_PATH:  ${{ vars.GH_POSITIONS_PATH || 'scripts/positions.json' }}

          # ── Alert tuning ─────────────────────────────────────────────────────────────
          # Variables (all optional — defaults shown):
          #   TELEGRAM_ENABLED     = true
          #   ALERT_COOLDOWN_HOURS = 1
          #   DIGEST_MODE          = true
          #   LB_MIN_SCORE         = 9
          #   LB_COOLDOWN_MIN      = 60
          #   LB_HOLD_LOCK         = 20
          #   LB_CVD_CYCLES        = 3
          TELEGRAM_ENABLED:     ${{ vars.TELEGRAM_ENABLED || 'true' }}
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '1' }}
          DIGEST_MODE:          ${{ vars.DIGEST_MODE || 'true' }}
          DRY_RUN:              ${{ inputs.dry_run || vars.DRY_RUN || 'false' }}
          LB_MIN_SCORE:         ${{ vars.LB_MIN_SCORE || '9' }}
          LB_COOLDOWN_MIN:      ${{ vars.LB_COOLDOWN_MIN || '60' }}
          LB_HOLD_LOCK:         ${{ vars.LB_HOLD_LOCK || '20' }}
          LB_CVD_CYCLES:        ${{ vars.LB_CVD_CYCLES || '3' }}

        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN — no Telegram messages will be sent"
            node alert-runner.js --dry-run
          else
            node alert-runner.js
          fi

      # ── Commit alert state + Reset env.js back to template format ──────────────────
      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Reset env.js back to blank values so no secrets leak into git logs
          cat > scripts/env.js << ENVEOF
          // Auto-generated by GitHub Actions — DO NOT edit manually.
          // Exposes secrets as window globals so the browser can send Telegram alerts
          // and push positions.json without storing credentials in localStorage.
          window.__GH_PAT       = '';
          window.__GH_REPO      = '';
          window.__TG_TOKEN     = '';
          window.__TG_CHAT      = '';
          ENVEOF

          # 2. Safely add files now that env.js contains no real tokens
          git add scripts/.alert-state.json scripts/positions.json scripts/env.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update alert state + env [skip ci]"
            git push
          fi
